name: Linux container and network compatibility
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      benchmark:
        description: Run the pinned Floci Lambda, Redis, and PostgreSQL benchmark
        type: boolean
        default: false
      floci_ref:
        description: Floci commit or ref to benchmark
        type: string
        default: e477e8e5dd50f9a6402c8fcc5bd01e9426b12f39
permissions:
  contents: read
concurrency:
  group: linux-compatibility-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compatibility:
    if: ${{ !inputs.benchmark }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: Check scope inventory and Rust tests
        run: |
          python3 tests/compatibility/inventory.py
          cargo test --locked -p kiri -p kiri-image -p kiri-proto
      - name: Build native Linux engine and agent
        # Build musl binaries for the Alpine-based disposable runtime. A host
        # glibc binary would fail to start there before any test could run.
        run: cargo xtask linux --arch amd64
      - name: Test native Linux agent
        run: |
          docker run --rm --privileged --tmpfs /tmp -v "$PWD:/src" -v kiri-cargo-amd64:/usr/local/cargo/registry -w /src \
            -e CARGO_TARGET_DIR=/src/target/linux-x86_64 rust:1-alpine sh -c \
            'apk add -q musl-dev libseccomp-dev libseccomp-static && cargo test --locked -p kiri-init'
      - name: Compare disposable Linux engines
        env:
          KIRI_BIN_DIR: ${{ github.workspace }}/target/linux-x86_64/release
        run: bash tests/compatibility/linux.sh
      - name: Check default Linux socket access
        env:
          KIRI_BIN_DIR: ${{ github.workspace }}/target/linux-x86_64/release
        run: bash tests/compatibility/socket-access.sh
      - name: Exercise Floci Lambda on both engines
        env:
          KIRI_BIN_DIR: ${{ github.workspace }}/target/linux-x86_64/release
          FLOCI_SAMPLES: "2"
        run: bash tests/compatibility/floci.sh
      - name: Preserve conformance and benchmark reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-compatibility
          path: |
            target/compatibility
            target/floci-benchmark
          if-no-files-found: ignore
  benchmark:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out the validated Floci source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: AndreKurait/floci
          ref: ${{ inputs.floci_ref }}
          path: target/floci-source
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          java-version: "25"
          distribution: temurin
          cache: maven
          cache-dependency-path: target/floci-source/pom.xml
      - name: Build the validated JVM application
        working-directory: target/floci-source
        run: |
          ./mvnw package -Dmaven.test.skip=true -B -ntp
          docker build -f docker/Dockerfile.jvm-package -t floci-runtime-benchmark:validated .
      - name: Record the measured Floci revision
        run: |
          mkdir -p target/floci-benchmark
          git -C target/floci-source rev-parse HEAD > target/floci-benchmark/floci-source.txt
      - name: Build native Linux engine and agent
        run: |
          rustup update stable --no-self-update
          rustup default stable
          cargo xtask linux --arch amd64
      - name: Measure both engines sequentially on the same two CPUs
        env:
          KIRI_BIN_DIR: ${{ github.workspace }}/target/linux-x86_64/release
          FLOCI_IMAGE: floci-runtime-benchmark:validated
          FLOCI_LOCAL_IMAGE: "1"
          FLOCI_CPUSET: "0,1"
          FLOCI_SAMPLES: "20"
          FLOCI_SERVICE_SAMPLES: "10"
        run: bash tests/compatibility/floci.sh
      - name: Preserve benchmark samples and environment
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: floci-runtime-benchmark
          path: target/floci-benchmark
          if-no-files-found: ignore
